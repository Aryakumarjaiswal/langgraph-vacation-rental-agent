apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayops-api
  labels:
    app: stayops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stayops-api
  template:
    metadata:
      labels:
        app: stayops-api
    spec:
      containers:
        - name: api
          image: stayops-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: stayops-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stayops-secrets
                  key: DB_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stayops-secrets
                  key: GEMINI_API_KEY
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: stayops-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stayops-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: stayops-secrets
                  key: TWILIO_FROM_NUMBER
            - name: EXECUTIVE_PHONE
              valueFrom:
                secretKeyRef:
                  name: stayops-secrets
                  key: EXECUTIVE_PHONE
            # Twilio webhook must be publicly reachable — set to API ingress URL.
            - name: API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: stayops-secrets
                  key: PUBLIC_API_URL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
