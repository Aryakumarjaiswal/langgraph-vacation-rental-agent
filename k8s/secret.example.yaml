# Copy to secret.yaml, fill values, apply once. Never commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: stayops-secrets
  labels:
    app: stayops
type: Opaque
stringData:
  DB_PASSWORD: "change-me"
  GEMINI_API_KEY: "change-me"
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_NUMBER: ""
  EXECUTIVE_PHONE: "+91XXXXXXXXXX"
  # Public URL Twilio uses to fetch TwiML (your API ingress / load balancer).
  PUBLIC_API_URL: "https://api.your-domain.com"
